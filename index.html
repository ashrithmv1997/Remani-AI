<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Remani AI 🤪</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

  <div class="bg"></div>

  <div class="app">

    <!-- 👩 COMIC LADY AVATAR -->
    <div class="avatarSection">
      <img id="avatarImg" src="remani-default.jpg" class="avatarImg" />
      <div class="name">Remani AI</div>
      <div class="status" id="status">Pucham Mode 😏</div>
    </div>

    <!-- HEADER -->
    <div class="topbar">
      <h2>🤪Remani AI🤪</h2>
      <p>**Lady Superstar**</p>
    </div>

    <!-- CHAT -->
    <div id="chatBox" class="chat"></div>

    <!-- INPUT -->
    <div class="inputBar">
      <input id="userInput" placeholder="Talk to Remani...She is Hearing you" />
      <button onclick="sendMessage()">Send 🚀</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
