<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remani AI</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    #chatBox {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #444;
      padding: 10px;
      margin-bottom: 10px;
    }

    .user {
      color: cyan;
      margin: 10px 0;
    }

    .bot {
      color: lime;
      margin: 10px 0;
    }

    input {
      width: 75%;
      padding: 10px;
    }

    button {
      padding: 10px;
    }
  </style>
</head>

<body>

  <h1>Remani AI</h1>

  <div id="chatBox"></div>

  <input type="text" id="userInput" placeholder="Type message..." />

  <button onclick="handleSend()">
    Send
  </button>

  <script src="script.js"></script>

</body>
</html>
