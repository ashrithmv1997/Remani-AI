<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Remani AI 🤪</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<div class="bg"></div>
<!-- REMANI INTRO SCREEN -->
<div id="introScreen">

  <div class="introGlow"></div>

  <img
    src="remani-default.jpg"
    id="introAvatar"
    alt="Remani AI"
  >

  <h1 id="introTitle">
    Remani AI ✨
  </h1>

  <p id="introSubtitle">
    She is waking Up......
  </p>

</div>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <h2>🤪 Remani AI 🤪</h2>
    <p>Lady Superstar</p>

    <!-- SOUND TOGGLE -->
    <div class="toggleContainer">
      <label class="switch">
        <input type="checkbox" id="soundToggle" checked>
        <span class="slider"></span>
      </label>
      <span class="toggleText">🔊</span>
    </div>
  </div>

  <!-- AVATAR -->
  <div class="avatarSection">
    <img id="avatarImg" src="remani-default.jpg" class="avatarImg" />
    <div class="name">Remani AI</div>
    <div class="status" id="status">Pucham Mode 😏</div>
  </div>

  <!-- CHAT -->
  <div id="chatBox" class="chat"></div>

  <!-- INPUT -->
  <div class="inputBar">
    <input id="userInput" placeholder="Talk to Remani...She is hearing" />
    <button onclick="sendMessage()">Send 🚀</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
